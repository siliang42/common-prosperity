<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Common Prosperity Lab">
  <title>Common Prosperity Lab</title>
  <defs>
    <linearGradient id="cpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17130d"/>
      <stop offset="0.55" stop-color="#0f0c08"/>
      <stop offset="1" stop-color="#070605"/>
    </linearGradient>
    <radialGradient id="cpGlow" cx="0.5" cy="0.44" r="0.58">
